<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Una dedicatoria para ti</title>

  <style>
    /* El CSS de la plantilla será inyectado por TuDetalle */
  </style>
</head>

<body>

  <div class="galaxy">

    <div class="stars"></div>
    <div class="stars stars-2"></div>
    <div class="stars stars-3"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="card">

      <div class="heart-wrapper">
        <div class="heart">♥</div>
      </div>

      <p class="eyebrow">
        Una dedicatoria especial
      </p>

      <h1 data-field="title">
        Para el amor de mi vida
      </h1>

      <p
        class="recipient"
        data-field="recipient"
      >
        Para ti
      </p>

      <div class="photo-wrapper">
        <div class="photo-placeholder">
          <span>♥</span>
        </div>

        <img
          data-field="photo"
          class="photo"
          alt="Foto especial"
        />
      </div>

      <div class="divider">
        <span>✦</span>
      </div>

      <p
        class="message"
        data-field="message"
      >
        Desde que llegaste a mi vida,
        todo se volvió más bonito.
      </p>

     <div class="signature">
  <span data-field="sender">Con todo mi amor</span>
  <strong>♥</strong>
</div>

    </main>

    <button
      class="music-button"
      data-music-button
      type="button"
      aria-label="Reproducir música"
    >
      ♪
    </button>

    <audio
      data-field="song"
      data-audio
      preload="none"
    ></audio>

    <div class="footer">
      Hecho con ♥ en TuDetalle
    </div>

  </div>

  <script>
    /* El JavaScript será inyectado por TuDetalle */
  </script>

</body>
</html>
