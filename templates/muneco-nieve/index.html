<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Muñeco de Nieve 3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pista de interacción -->
  <p class="hint" id="hint">Gira el globo, toca al muñeco o agítalo</p>

  <!-- Globo de diálogo del muñeco -->
  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>

  <!-- Acciones -->
  <div class="tools">
    <button class="fab" id="shakeBtn" aria-label="Agitar el globo de nieve">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v20M4.2 7l15.6 10M19.8 7L4.2 17"/><path d="M9.5 3.8L12 6l2.5-2.2M9.5 20.2L12 18l2.5 2.2"/>
      </svg>
    </button>
    <button class="fab" id="ballBtn" aria-label="Lanzar una bola de nieve">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="15.5" cy="8.5" r="5"/><path d="M2.5 14l5.5-3M3.5 20l7-4"/>
      </svg>
    </button>
  </div>

  <!-- Audio y botón de música -->
  <audio id="bgMusic" loop preload="auto"></audio>
  <button class="fab" id="musicBtn" aria-label="Activar o pausar la música" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </button>

  <!-- Importmap para Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- Script principal como módulo -->
  <script type="module" src="script.js"></script>
</body>
</html>
