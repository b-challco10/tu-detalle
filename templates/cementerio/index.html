<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cementerio de Fantasmas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Three.js (el importmap debe ir ANTES del script del módulo) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <!-- Cielo y escena 3D -->
  <div class="sky" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Título -->
  <header class="top">
    <h1 class="title" id="titulo">Noche de fantasmas</h1>
    <p class="hint" id="hint">Toca a los fantasmas</p>
  </header>

  <!-- Etiquetas que siguen a cada fantasma (también sirven con teclado) -->
  <div class="tags" id="tags">
    <button class="tag" id="tag0" data-panel="gallery" type="button" aria-label="Abrir la galería de fotos" style="--c: 255, 210, 122">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></svg>
      <span>Fotos</span>
    </button>

    <button class="tag" id="tag1" data-panel="music" type="button" aria-label="Abrir el reproductor de música" style="--c: 143, 183, 255">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
      <span>Música</span>
    </button>

    <button class="tag" id="tag2" data-panel="letter" type="button" aria-label="Abrir la carta" style="--c: 255, 143, 192">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
      <span>Carta</span>
    </button>
  </div>

  <!-- Si el celular no soporta 3D, se usan fantasmas planos -->
  <div class="fallback" id="fallback" hidden></div>

  <!-- Canción sonando (cuando el reproductor está cerrado) -->
  <button class="now" id="nowPlaying" type="button" aria-label="Abrir el reproductor de música" hidden>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="now__title" id="nowTitle">Canción</span>
  </button>

  <!-- ============ PANEL 1: GALERÍA ============ -->
  <section class="panel" id="panelGallery" role="dialog" aria-modal="true" aria-label="Galería de recuerdos" aria-hidden="true">
    <div class="panel__backdrop" data-close></div>

    <div class="panel__sheet panel__sheet--gallery">
      <button class="panel__close" type="button" data-close aria-label="Cerrar la galería">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>

      <h2 class="panel__title">Recuerdos</h2>

      <div class="gcar" id="gCar">
        <div class="gcar__track" id="gTrack"></div>

        <button class="gnav gnav--prev" id="gPrev" type="button" aria-label="Foto anterior">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button class="gnav gnav--next" id="gNext" type="button" aria-label="Foto siguiente">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </div>

      <div class="gfoot" id="gFoot">
        <span class="gcount" id="gCount">1 / 1</span>
        <div class="gdots" id="gDots"></div>
      </div>

      <p class="panel__empty" id="gEmpty" hidden>Todavía no hay fotos en esta galería.</p>
    </div>
  </section>

  <!-- ============ PANEL 2: MÚSICA ============ -->
  <section class="panel" id="panelMusic" role="dialog" aria-modal="true" aria-label="Reproductor de música" aria-hidden="true">
    <div class="panel__backdrop" data-close></div>

    <div class="panel__sheet panel__sheet--music">
      <button class="panel__close" type="button" data-close aria-label="Cerrar el reproductor">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>

      <div class="player" id="playerBody">
        <div class="disc" id="disc" aria-hidden="true">
          <div class="disc__label"></div>
        </div>

        <p class="player__count" id="trackCount">Canción 1 de 3</p>
        <h2 class="player__title" id="trackTitle">—</h2>

        <div class="seek">
          <span class="seek__time" id="timeNow">0:00</span>

          <div class="seek__bar" id="seek" role="slider" tabindex="0" aria-label="Posición de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="seek__fill" id="seekFill"></div>
            <div class="seek__knob" id="seekKnob"></div>
          </div>

          <span class="seek__time" id="timeTotal">0:00</span>
        </div>

        <div class="controls">
          <button class="ctl" id="mPrev" type="button" aria-label="Canción anterior">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20" /><line x1="5" y1="19" x2="5" y2="5" /></svg>
          </button>

          <button class="ctl ctl--play" id="mPlay" type="button" aria-label="Reproducir">
            <svg class="icon icon--play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3" /></svg>
            <svg class="icon icon--pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></svg>
          </button>

          <button class="ctl" id="mNext" type="button" aria-label="Canción siguiente">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" y1="5" x2="19" y2="19" /></svg>
          </button>
        </div>

        <ul class="tracklist" id="tracklist"></ul>
        <p class="player__error" id="playerError" role="status" hidden></p>
      </div>

      <p class="panel__empty" id="musicEmpty" hidden>Todavía no hay canciones en este reproductor.</p>
    </div>
  </section>

  <!-- ============ PANEL 3: CARTA ============ -->
  <section class="panel panel--letter" id="panelLetter" role="dialog" aria-modal="true" aria-label="Carta" aria-hidden="true">
    <div class="panel__backdrop" data-close></div>

    <button class="panel__close panel__close--float" type="button" data-close aria-label="Cerrar la carta">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
    </button>

    <div class="letter" id="letter">
      <!-- Sobre -->
      <div class="envelope" id="envelope" aria-hidden="true">
        <div class="env__back"></div>
        <div class="env__front"></div>
        <div class="env__flap"></div>

        <div class="seal">
          <span class="seal__half seal__half--l"></span>
          <span class="seal__half seal__half--r"></span>
          <svg class="seal__bat" viewBox="0 0 40 24" aria-hidden="true"><path d="M20 4 C18 2 15 4 14 6 C10 4 5 5 1 9 C5 9 7 11 8 14 C10 12 12 12 14 14 C15 12 17 12 18 15 L20 11 L22 15 C23 12 25 12 26 14 C28 12 30 12 32 14 C33 11 35 9 39 9 C35 5 30 4 26 6 C25 4 22 2 20 4Z" fill="#3d0a0a" /></svg>
        </div>
      </div>

      <!-- Papel -->
      <div class="paper-shell" id="paperShell">
        <article class="paper" id="paper">
          <svg class="paper__web paper__web--tl" viewBox="0 0 100 100" aria-hidden="true"><path id="webA" d="" /></svg>
          <svg class="paper__web paper__web--br" viewBox="0 0 100 100" aria-hidden="true"><path id="webB" d="" /></svg>

          <svg class="paper__bats" viewBox="0 0 120 30" aria-hidden="true">
            <g fill="#2a1408">
              <path transform="translate(8 2)" d="M20 6 C18 4 15 6 14 8 C10 6 5 7 1 11 C5 11 7 13 8 16 C10 14 12 14 14 16 C15 14 17 14 18 17 L20 13 L22 17 C23 14 25 14 26 16 C28 14 30 14 32 16 C33 13 35 11 39 11 C35 7 30 6 26 8 C25 6 22 4 20 6Z" />
              <path transform="translate(70 0) scale(.7)" d="M20 6 C18 4 15 6 14 8 C10 6 5 7 1 11 C5 11 7 13 8 16 C10 14 12 14 14 16 C15 14 17 14 18 17 L20 13 L22 17 C23 14 25 14 26 16 C28 14 30 14 32 16 C33 13 35 11 39 11 C35 7 30 6 26 8 C25 6 22 4 20 6Z" />
              <path transform="translate(98 8) scale(.5)" d="M20 6 C18 4 15 6 14 8 C10 6 5 7 1 11 C5 11 7 13 8 16 C10 14 12 14 14 16 C15 14 17 14 18 17 L20 13 L22 17 C23 14 25 14 26 16 C28 14 30 14 32 16 C33 13 35 11 39 11 C35 7 30 6 26 8 C25 6 22 4 20 6Z" />
            </g>
          </svg>

          <div class="paper__scroll" id="paperScroll">
            <h2 class="paper__title" id="cartaTitulo">Una carta desde el más allá</h2>
            <p class="paper__text" id="cartaTexto"></p>
            <p class="paper__sign" id="cartaFirma" hidden></p>
          </div>

          <div class="paper__stamp" aria-hidden="true">
            <svg viewBox="0 0 40 24"><path d="M20 4 C18 2 15 4 14 6 C10 4 5 5 1 9 C5 9 7 11 8 14 C10 12 12 12 14 14 C15 12 17 12 18 15 L20 11 L22 15 C23 12 25 12 26 14 C28 12 30 12 32 14 C33 11 35 9 39 9 C35 5 30 4 26 6 C25 4 22 2 20 4Z" fill="#f4d9a6" /></svg>
          </div>

          <div class="paper__glow" aria-hidden="true"></div>
        </article>
      </div>
    </div>
  </section>

  <!-- Foto ampliada -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Cerrar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
    </button>
    <img id="lightboxImg" alt="" />
  </div>

  <!-- Pantalla de carga -->
  <div class="loading" id="loading" role="status">
    <span>Despertando a los fantasmas…</span>
  </div>

  <audio id="player" preload="none"></audio>

  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js"></script>
</body>
</html>
