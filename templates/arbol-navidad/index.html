<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Árbol de Navidad 3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pista de interacción -->
  <p class="hint" id="hint">Gira el árbol y toca las fotos que cuelgan</p>

  <!-- Modal Carrusel -->
  <div id="galleryModal" class="gallery-modal">
    <div class="gallery-content">
      <button id="closeGallery" class="close-btn" aria-label="Cerrar galería">✕</button>
      <div class="carousel">
        <button id="prevBtn" class="nav-btn prev" aria-label="Anterior">‹</button>
        <div class="carousel-track" id="carouselTrack"></div>
        <button id="nextBtn" class="nav-btn next" aria-label="Siguiente">›</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <!-- Juegos de luces -->
  <button id="lightsBtn" aria-label="Cambiar las luces del árbol" aria-expanded="false" aria-controls="lightsPanel">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>
    </svg>
  </button>
  <div class="lights-panel" id="lightsPanel" role="group" aria-label="Juegos de luces">
    <p class="lights-name" id="lightsName"></p>
    <div class="lights-grid" id="lightsGrid"></div>
    <div class="fx-list" id="fxList"></div>
    <button class="auto-btn" id="autoBtn" type="button" aria-pressed="true">Automático</button>
  </div>

  <!-- Audio y botón de música -->
  <audio id="bgMusic" loop preload="auto"></audio>
  <button id="musicBtn" aria-label="Activar o pausar la música" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </button>

  <!-- Importmap para Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- Script principal como módulo -->
  <script type="module" src="script.js"></script>
</body>
</html>
